<style>
:root{--b:#064C7D;--bs:#E6EEF6;--ink:#111827;--mut:#4B5563;--line:#E5E7EB;--soft:#F3F4F6;--g:#15803D;--gs:#DCFCE7;--r:#B91C1C;--rs:#FEE2E2;--a:#9A3412;--as:#FFEDD5;--y:#78350F;--ys:#FEF3C7}
*{box-sizing:border-box}
body{margin:0;font-family:Poppins,system-ui,sans-serif;color:var(--ink);background:#fff;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--b)}
.shell{display:flex;min-height:100vh}
.side{width:250px;flex:none;border-right:1px solid var(--line);padding:24px 16px;display:flex;flex-direction:column;gap:22px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px}
.brand img{width:38px;height:40px;object-fit:contain}
.brand b{display:block;font-size:15px}.brand small{color:var(--mut);font-size:12px}
.nav{display:flex;flex-direction:column;gap:4px}
.nav button{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 12px;border:0;border-radius:8px;background:none;font-size:15px;font-weight:500;color:#374151;text-align:left}
.nav button.on{background:var(--bs);color:var(--b);font-weight:600}
.side .who{margin-top:auto;font-size:13px;color:var(--mut);display:flex;flex-direction:column;gap:8px}
.main{flex:1;min-width:0;padding:32px 40px 48px;display:flex;flex-direction:column;gap:22px;max-width:1100px}
.top{display:none}
.bnav{display:none}
h1{margin:0;font-size:24px}h2{margin:0;font-size:17px}h3{margin:0;font-size:15px}
.sub{color:var(--mut);font-size:14px}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.between{justify-content:space-between}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.card{border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:6px}
.card .lbl{font-size:13px;color:var(--mut)}
.card .val{font-size:22px;font-weight:700}
.box{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.box>.hd{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.li{padding:12px 18px;border-top:1px solid #F3F4F6;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.li:first-child{border-top:0}
.btn{min-height:48px;padding:0 20px;border-radius:10px;border:1px solid #D1D5DB;background:#fff;font-weight:600;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;color:var(--ink)}
.btn.p{background:var(--b);border-color:var(--b);color:#fff}
.btn.g{background:var(--g);border-color:var(--g);color:#fff}
.btn.r{background:var(--r);border-color:var(--r);color:#fff}
.btn.sm{min-height:38px;padding:0 12px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.55;cursor:default}
.chip{min-height:38px;padding:0 14px;border-radius:999px;border:1px solid #D1D5DB;background:#fff;font-size:14px;font-weight:600}
.chip.on{background:var(--b);border-color:var(--b);color:#fff}
.tag{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600}
.t-g{background:var(--gs);color:#14532D}.t-r{background:var(--rs);color:#991B1B}.t-a{background:var(--as);color:var(--a)}.t-y{background:var(--ys);color:var(--y)}.t-n{background:var(--soft);color:#374151}.t-b{background:var(--bs);color:var(--b)}
.bar{height:10px;border-radius:999px;background:var(--soft);overflow:hidden}.bar>i{display:block;height:100%;border-radius:999px;background:var(--b)}
.inp{min-height:48px;width:100%;padding:0 12px;border:1px solid #D1D5DB;border-radius:10px;font-size:16px;background:#fff}
label.f{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:600}
.note{padding:12px 14px;border-radius:10px;font-size:14px;line-height:1.5}
.n-y{background:var(--ys);color:var(--y)}.n-r{background:var(--rs);color:#991B1B;font-weight:600}.n-n{background:var(--soft);color:#374151}.n-g{background:#F0FDF4;color:#14532D}
.amt-in{color:var(--g);font-weight:700}.amt-out{color:var(--r);font-weight:700}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{min-height:78px;padding:12px;border-radius:12px;border:2px solid var(--line);background:#fff;text-align:left;display:flex;flex-direction:column;justify-content:center;gap:3px}
.tile b{font-size:15px}.tile small{font-size:12px;color:var(--mut)}
.tile.on{border-color:var(--b);background:var(--bs)}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.steps i{height:6px;border-radius:999px;background:var(--line)}.steps i.on{background:var(--b)}
.form{max-width:520px;display:flex;flex-direction:column;gap:16px}
.qty{display:flex;align-items:center;gap:4px}.qty button{width:44px;height:44px;border-radius:10px;border:1px solid #D1D5DB;background:#fff;font-size:20px;font-weight:600}.qty button.plus{background:var(--b);border-color:var(--b);color:#fff}.qty span{min-width:28px;text-align:center;font-weight:700}
.big{font-size:32px;font-weight:700}
.tbl{overflow-x:auto}.tbl table{width:100%;border-collapse:collapse;font-size:14px;min-width:720px}.tbl th{text-align:left;color:var(--mut);font-weight:500;padding:10px 12px}.tbl td{padding:10px 12px;border-top:1px solid #F3F4F6;vertical-align:top}
.load{position:fixed;inset:0;background:rgba(255,255,255,.7);display:none;align-items:center;justify-content:center;z-index:50;font-weight:600}
.load.on{display:flex}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#111827;color:#fff;padding:12px 18px;border-radius:10px;font-size:14px;z-index:60;max-width:90vw;display:none}
.toast.on{display:block}
.login{max-width:360px;margin:12vh auto;padding:24px;display:flex;flex-direction:column;gap:16px;text-align:center}
.login img{width:72px;height:76px;margin:0 auto}
.hide{display:none!important}
@media (max-width:760px){
  .side{display:none}
  .top{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:5}
  .shell{flex-direction:column}
  .main{padding:18px 16px 96px;gap:18px}
  .bnav{display:flex;position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:4px 4px calc(4px + env(safe-area-inset-bottom));z-index:10}
  .bnav button{flex:1;min-height:56px;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:500;color:var(--mut)}
  .bnav button.on{color:var(--b);font-weight:700}
  h1{font-size:21px}
}
</style>
</head>

<div id="app"></div>
<div class="load" id="load">Sedang proses…</div>

function call(fn){
  const args=[].slice.call(arguments,1);
  if(window.google&&google.script&&google.script.run){
    return new Promise((ok,no)=>{ google.script.run.withSuccessHandler(ok).withFailureHandler(e=>no(e&&e.message?e:new Error(String(e))))[fn].apply(null,args); });
  }
  return fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fn:fn,args:args})})
    .then(r=>{ if(!r.ok) throw new Error('SAFINAH tak dapat dihubungi ('+r.status+').'); return r.json(); })
    .then(j=>{ if(!j.ok) throw new Error(j.error||'Ralat'); return j.data; })
    .catch(e=>{ if(e&&/fetch|network/i.test(e.message||'')) throw new Error('Tiada sambungan internet, atau SAFINAH tak dapat dihubungi.'); throw e; });
}
function busy(on){ $('load').classList.toggle('on', !!on); }
let tt; function toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('on'); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove('on'),3500); }
async function run(p){ busy(true); try { return await p; } catch(e){ toast(e.message||'Ralat'); throw e; } finally { busy(false); } }
function dateFmt(s){ if(!s) return ''; const p=s.split('-'); return p[2]+'/'+p[1]; }

/* ---------- gambar resit: kecilkan sebelum hantar ---------- */
function readReceipt(file){
  return new Promise((ok,no)=>{
    if(!file) return ok(null);
    const fr=new FileReader();
    fr.onerror=()=>no(new Error('Gagal baca fail'));
    if(!/^image\//.test(file.type)){ fr.onload=()=>ok({name:file.name,mime:file.type||'application/pdf',data:String(fr.result).split(',')[1]}); fr.readAsDataURL(file); return; }
    fr.onload=()=>{ const img=new Image(); img.onload=()=>{ const max=1400; let w=img.width,h=img.height; if(Math.max(w,h)>max){ const k=max/Math.max(w,h); w=Math.round(w*k); h=Math.round(h*k);} const c=document.createElement('canvas'); c.width=w; c.height=h; c.getContext('2d').drawImage(img,0,0,w,h); ok({name:(file.name||'resit').replace(/\.\w+$/,'')+'.jpg',mime:'image/jpeg',data:c.toDataURL('image/jpeg',0.72).split(',')[1]}); }; img.onerror=()=>no(new Error('Gambar tidak dapat dibaca')); img.src=fr.result; };
    fr.readAsDataURL(file);
  });
}

/* ---------- baca fail SalesReport Wasepme ---------- */
function cleanCell(h){ return String(h).replace(/<br\s*\/?>/gi,' ').replace(/<[^>]+>/g,' ').replace(/&nbsp;/g,' ').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&#39;|&apos;/g,"'").replace(/&#(\d+);/g,(m,n)=>String.fromCharCode(+n)).replace(/\s+/g,' ').trim(); }
function money(v){ v=String(v||'').trim(); if(!v||v==='-') return 0; const n=parseFloat(v.replace(/RM/i,'').replace(/,/g,'').replace(/\s/g,'')); return isFinite(n)?n:0; }
function parseWasepme(text){
  const rows=[]; const trRe=/<tr[^>]*>([\s\S]*?)<\/tr>/gi; let m;
  while((m=trRe.exec(text))){ const cells=[]; const tdRe=/<t[dh][^>]*>([\s\S]*?)<\/t[dh]>/gi; let c; while((c=tdRe.exec(m[1]))) cells.push(cleanCell(c[1])); if(cells.length) rows.push(cells); }
  const hi=rows.findIndex(r=>r.indexOf('No. Pesanan')>-1);
  if(hi<0) throw new Error('Ini bukan fail SalesReport Wasepme (lajur "No. Pesanan" tiada).');
  const H=rows[hi]; const ix=n=>H.indexOf(n);
  const need=['Tarikh Pesanan','No. Pesanan','Status','Kaedah Pembayaran','Subjumlah','Jumlah Keseluruhan'];
  need.forEach(n=>{ if(ix(n)<0) throw new Error('Lajur "'+n+'" tiada dalam fail.'); });
  const out=[];
  rows.slice(hi+1).forEach(r=>{
    const g=n=>ix(n)>-1?(r[ix(n)]||''):'';
    const rawNo=g('No. Pesanan'); if(!rawNo||/^jumlah$/i.test(r[0])) return;
    const dm=g('Tarikh Pesanan').match(/(\d{1,2})\/(\d{1,2})\/(\d{4})\s+(\d{1,2}):(\d{2})(?::\d{2})?\s*(AM|PM)?/i);
    let tarikh='';
    if(dm){ let hh=+dm[4]; if(dm[6]){ const pm=/pm/i.test(dm[6]); if(pm&&hh<12) hh+=12; if(!pm&&hh===12) hh=0; } tarikh=dm[3]+'-'+('0'+dm[2]).slice(-2)+'-'+('0'+dm[1]).slice(-2)+'T'+('0'+hh).slice(-2)+':'+dm[5]; }
    const items=[]; const iRe=/(\d+)\s*x\s*(.+?)\s+RM\s*([\d,]+\.\d{2})/gi; let im; const resit=g('Resit');
    while((im=iRe.exec(resit))) items.push({q:+im[1], judul:im[2].trim(), jumlah:money(im[3])});
    const isPos=/\(POS\)/i.test(rawNo)||/point of sale/i.test(g('Kaedah Pengiriman'));
    const wa=g('No. WhatsApp'); const st=wa.match(/\(([^)]+)\)\s*$/);
    out.push({ no:rawNo.replace(/\s*\(POS\)\s*/i,'').trim(), tarikh, status:g('Status'), payment:g('Kaedah Pembayaran'),
      penghantaran:g('Kaedah Pengiriman'), subtotal:money(g('Subjumlah')), total:money(g('Jumlah Keseluruhan')),
      cost:money(g('Jumlah Kos')), items, isPos, oleh: st?st[1]:'' });
  });
  return out;
}

function render(){
  const app=$('app');
  if(!S.user){ app.innerHTML=loginHtml(); return; }
  const pages=S.user.role==='pemilik'?PAGES_OWNER:PAGES_STAF;
  const nav=pages.map(p=>'<button class="'+(S.page===p[0]?'on':'')+'" data-act="go" data-p="'+p[0]+'">'+ico(p[0])+'<span>'+p[1]+'</span></button>').join('');
  const bnav=pages.map(p=>'<button class="'+(S.page===p[0]?'on':'')+'" data-act="go" data-p="'+p[0]+'">'+ico(p[0],22)+'<span>'+SHORT[p[0]]+'</span></button>').join('');
  app.innerHTML='<div class="shell">'
   +'<aside class="side"><div class="brand"><img src="'+LOGO+'" alt="Logo Hikmah Pendita"><div><b style="letter-spacing:1px">SAFINAH</b><small>Hikmah Pendita Resources</small></div></div><nav class="nav" aria-label="Menu">'+nav+'</nav><div class="who"><span>'+esc(S.user.name)+' · '+(S.user.role==='pemilik'?'Pemilik':'Staf')+'</span><button class="btn sm" data-act="logout">Log keluar</button><span style="font-size:11px">SAFINAH v1.0 · 2026</span></div></aside>'
   +'<header class="top"><div class="brand"><img src="'+LOGO+'" alt="Logo Hikmah Pendita"><b style="letter-spacing:1px">SAFINAH</b></div><button class="btn sm" data-act="logout">Keluar</button></header>'
   +'<main class="main" id="page">'+pageHtml()+'</main>'
   +'<nav class="bnav" aria-label="Menu telefon">'+bnav+'</nav></div>';
}
function pageHtml(){
  switch(S.page){
    case 'utama': return S.user.role==='pemilik'?utamaOwner():utamaStaf();
    case 'rekod': return rekodHtml();
    case 'tunai': return tunaiHtml();
    case 'imp': return importHtml();
    case 'agihan': return agihanHtml();
    case 'katalog': return katalogHtml();
  }
  return '';
}
function repaint(){ const p=$('page'); if(p) p.innerHTML=pageHtml(); else render(); }

async function go(p){
  S.page=p; window.scrollTo(0,0);
  if(p==='rekod' && !S.R) S.R=newRekod('jualan');
  render();
  try{
    if(p==='utama'){ S.data.dash=await call('api_dashboard',S.pin); }
    if(p==='tunai'){ S.data.tx=await call('api_listTx',S.pin,S.tx.month||''); S.tx.month=S.data.tx.bulan; }
    if(p==='agihan'){ S.data.ag=await call('api_agihanInfo',S.pin); S.ag={untung:S.data.ag.untungCadangan, confirm:false, done:null}; }

/* ---------- REKOD ---------- */
function newRekod(tab){ return {tab, step:1, saluran:'Kedai', items:{}, extra:[], q:'', kaedah:'', jumlah:'', kategori:'', bank:'', resit:null, resitName:'', tarikh:(S.boot&&S.boot.today)||'', keterangan:'', diskaun:'', done:null, tried:false}; }
function rekodItems(){
  const R=S.R; const out=[];
  (S.boot.katalog||[]).forEach(k=>{ const q=R.items[k.judul]||0; if(q>0) out.push({judul:k.judul,q,harga:k.harga}); });
  R.extra.forEach(x=>{ if(x.q>0) out.push(x); });
  return out;
}
function rekodValid(){
  const R=S.R;
  if(R.tab==='jualan'){ if(R.step===1) return !!R.saluran; if(R.step===2) return rekodItems().length>0; return !!R.kaedah; }
  if(R.step===1) return Number(R.jumlah)>0; if(R.step===2) return !!R.kategori; return !!R.bank;
}

  if(!I||!I.preview){
    return h+'<label class="card" style="align-items:center;text-align:center;border:2px dashed #9CA3AF;padding:36px;cursor:pointer;gap:10px">'+ico('imp',40)+'<b>Pilih fail SalesReport.xls</b><span class="sub">Terus dari Wasepme, tak perlu buka dalam Excel</span><input type="file" accept=".xls,.xlsx,.html,.htm" data-in="impFile" style="max-width:260px"></label>'
     +'<div class="note n-n"><b>Cara dapatkan fail:</b> Wasepme → Laporan Jualan → pilih tempoh → Eksport. Buat sebelum agihan 10hb &amp; 25hb.</div>';
  }
  if(I.done){
    return h+'<div class="note n-g" style="font-size:16px"><b>'+I.done.diimport+' pesanan diimport ✓</b><br>Jualan kitab '+rm(I.done.jualan)+(I.done.kitabBaru?' · '+I.done.kitabBaru+' judul baru ditambah ke Katalog (isi kos)':'')+(I.done.tunai?'<br>Tunai '+rm(I.done.tunai)+' perlu dimasukkan ke Maybank.':'')+'</div><div class="row"><button class="btn p" data-act="go" data-p="tunai">Lihat Aliran Tunai</button><button class="btn" data-act="impReset">Import fail lain</button>'+(I.done.kitabBaru?'<button class="btn" data-act="go" data-p="katalog">Isi kos di Katalog</button>':'')+'</div>';
  }
  const p=I.preview, s=p.ringkasan;
  const posCount=I.orders.filter(o=>o.isPos).length;
  const bay=Object.keys(s.bayaran).map(k=>k+' '+s.bayaran[k]).join(' · ');
  const low=p.rows.filter(r=>r.bendera.some(b=>/terlalu rendah/.test(b)));
  h+='<div class="note n-n row between"><span>'+esc(I.fileName)+' · '+I.orders.length+' pesanan</span><button class="btn sm" data-act="impReset">Tukar fail</button></div>'
   +'<div class="grid"><div class="card" style="background:var(--gs)"><span class="lbl">Akan diimport</span><span class="val">'+s.import+'</span></div><div class="card"><span class="lbl">Dilangkau</span><span class="val">'+s.langkau+'</span></div><div class="card"><span class="lbl">Sudah pernah diimport</span><span class="val">'+s.ada+'</span></div><div class="card"><span class="lbl">Tiada kos kitab</span><span class="val" style="color:'+(s.tiadaKos?'var(--a)':'inherit')+'">'+s.tiadaKos+'</span></div></div>'
   +(posCount?'<label class="note n-y row" style="cursor:pointer"><input type="checkbox" data-in="impPos" '+(I.includePos?'checked':'')+' style="width:20px;height:20px"> <span><b>Import '+posCount+' jualan POS Wasepme</b> — tanda untuk import pertama sahaja. Lepas ini jualan kedai/event direkod di Rekod Jualan.</span></label>':'')
   +'<section class="card" style="border:2px solid var(--b)"><div class="row between"><span>Jualan kitab</span><b>'+rm(s.jualan)+'</b></div><div class="row between sub"><span>Caj pos dikutip (bukan jualan)</span><span>'+rm(s.pos)+'</span></div><div class="row between" style="font-weight:700"><span>Jumlah duit masuk</span><span>'+rm(s.masuk)+'</span></div><div class="sub">'+esc(bay)+(s.tunai?' · tunai '+rm(s.tunai)+' belum masuk Maybank':'')+'</div></section>'
   +(p.kitabBaru.length?'<div class="note n-y">'+p.kitabBaru.length+' judul kitab belum ada dalam Katalog — akan ditambah automatik. Isi kos di Katalog selepas import.</div>':'')
   +low.map(r=>'<div class="note n-r">#'+esc(r.no)+': '+esc(r.bendera.find(b=>/terlalu rendah/.test(b)))+'</div>').join('')
   +'<section class="box tbl"><table><thead><tr><th>No.</th><th>Tarikh</th><th>Kitab</th><th style="text-align:right">Jualan</th><th>Bayaran</th><th>Status</th><th>Keputusan</th></tr></thead><tbody>'
   +p.rows.map(r=>{ const t=r.keputusan==='import'?['Import','t-g']:(r.keputusan==='ada'?['Sudah ada','t-n']:['Langkau','t-n']); return '<tr><td><b>'+esc(r.no)+'</b>'+(r.isPos?' <span class="tag t-y">POS</span>':'')+'</td><td>'+dateFmt((r.tarikh||'').slice(0,10))+'</td><td>'+esc(r.items.map(i=>i.q+'× '+i.judul).join(', '))+(r.bendera.length?'<br><span class="tag t-a">'+esc(r.bendera.join('; '))+'</span>':'')+'</td><td style="text-align:right">'+rm(r.subtotal)+'</td><td>'+esc(r.payment)+'</td><td>'+esc(r.status)+'</td><td><span class="tag '+t[1]+'">'+t[0]+'</span>'+(r.sebab?'<div class="sub" style="font-size:12px">'+esc(r.sebab)+'</div>':'')+'</td></tr>'; }).join('')
   +'</tbody></table></section>'
   +'<div class="row"><button class="btn g" style="flex:1" data-act="impCommit" '+(s.import?'':'disabled')+'>Sahkan &amp; import '+s.import+' pesanan</button><button class="btn" data-act="impReset">Batal</button></div>';
  return h;
}
async function impPreview(){
  const I=S.imp;
  try{ I.preview=await run(call('api_previewImport',S.pin,I.orders,I.includePos)); repaint(); }catch(e){}
}

/* ---------- AGIHAN ---------- */
function agihanHtml(){
  const d=S.data.ag, A=S.ag;
  let h='<div><h1>Agihan Profit First</h1><div class="sub">Rentak 10hb &amp; 25hb · agihan seterusnya '+(d?dateFmt(d.seterusnya):'')+'</div></div>';
  if(!d) return h+'<div class="sub">Memuatkan…</div>';
  if(A.done){
    return h+'<div class="note n-g"><b>Agihan direkod ✓</b> Sekarang buat pindahan sebenar dalam app bank:</div><section class="box">'+A.done.parts.map(p=>'<div class="li" style="justify-content:space-between"><span>Maybank → <b>'+esc(p.ke)+'</b> ('+esc(p.nama)+' '+p.pct+'%)</span><b>'+rm(p.jumlah)+'</b></div>').join('')+'</section><div class="note n-n">Bayar semua bil dari Hong Leong sahaja. Jangan pinjam dari OCBC.</div>';
  }
  const u=Number(A.untung)||0;
  const parts=[['Profit','OCBC',d.pelan.p[0]],['Cukai','OCBC',d.pelan.p[1]],['Gaji pemilik','Bank Islam',d.pelan.p[2]],['Belanja operasi','Hong Leong',d.pelan.p[3]]];
  h+='<div class="grid"><div class="card"><span class="lbl">Jualan belum diagih</span><span class="val">'+rm(d.jualan)+'</span><span class="sub">'+d.bilangan+' rekod · duit di bank</span></div><div class="card"><span class="lbl">Kekal di Maybank (duit stok)</span><span class="val">'+rm(Math.max(0,d.jualan-u))+'</span></div><div class="card" style="background:var(--bs)"><span class="lbl">Untung sebenar diagih</span><span class="val" style="color:var(--b)">'+rm(u)+'</span></div></div>'
   +(d.tunaiBelumBank>0?'<div class="note n-y">Tunai '+rm(d.tunaiBelumBank)+' belum masuk Maybank — tidak dikira. Rekod bank-in dahulu jika sudah dimasukkan.</div>':'')
   +(d.jualanTanpaKos>0?'<div class="note n-n">Untung sebenar = '+rm(d.untungKnown)+' (jualan yang ada kos) + anggaran '+d.pelan.margin+'% untuk '+rm(d.jualanTanpaKos)+' jualan tanpa kos. Isi kos di Katalog untuk angka tepat.</div>':'')
   +'<label class="f" style="max-width:320px">Untung sebenar untuk diagih (RM)<input class="inp" type="number" inputmode="decimal" step="0.01" data-in="agU" value="'+esc(A.untung)+'" style="font-size:22px;font-weight:700"></label>'
   +'<section class="box"><div class="hd"><h2>Pindahkan dari Maybank</h2><span class="sub">Peratus pelan bulan ini</span></div>'+parts.map(p=>'<div class="li" style="justify-content:space-between"><span><span class="tag t-b">'+p[2]+'%</span> <b>'+p[0]+'</b> → '+p[1]+'</span><b>'+rm(u*p[2]/100)+'</b></div>').join('')+'</section>'
   +(d.ocbc&&(d.ocbc.profit||d.ocbc.cukai)?'<div class="note n-n">Dalam OCBC (dari agihan SAFINAH): Profit <b>'+rm(d.ocbc.profit)+'</b> · Cukai <b>'+rm(d.ocbc.cukai)+'</b></div>':'')
   +'<button class="btn p" data-act="agSave" '+(u>0?'':'disabled')+'>'+(A.confirm?'Tekan sekali lagi untuk sahkan':'Sahkan &amp; rekod agihan')+'</button>';
  return h;
}

/* ---------- KATALOG ---------- */
function katalogHtml(){
  const d=S.data.kat, K=S.kat;
  let h='<div><h1>Katalog Kitab</h1><div class="sub">Kos kitab = harga LE ÷ rate + kos pos. Kos inilah yang menentukan untung sebenar.</div></div>';
  if(!d) return h+'<div class="sub">Memuatkan…</div>';
  const q=K.q.toLowerCase();
  const rows=d.rows.filter(r=>!q||String(r.judul).toLowerCase().indexOf(q)>-1).sort((a,b)=>(a.kos>0)-(b.kos>0)||String(a.judul).localeCompare(String(b.judul)));
  const missing=d.rows.filter(r=>!(r.kos>0)).length;
  h+='<div class="row"><input class="inp" style="flex:1 1 220px" type="search" placeholder="Cari judul…" data-in="kq" value="'+esc(K.q)+'" aria-label="Cari judul"><button class="btn p" data-act="katNew">+ Kitab baru</button></div>'
   +(missing?'<div class="note n-y">'+missing+' judul belum ada kos. Jualan kitab ini guna anggaran sahaja.</div>':'<div class="note n-g">Semua judul ada kos ✓</div>')
   +'<div class="sub">Rate '+d.rate+' · pos ringan RM'+d.posRingan+' · pos berat RM'+d.posBerat+' · markup '+d.markup+'% (ubah dalam sheet Tetapan)</div>';
  if(K.edit){
    const e=K.edit;
    const kos=e.le!==''&&Number(e.le)>0?(Number(e.le)/d.rate+(e.berat==='berat'?d.posBerat:d.posRingan)):Number(e.kos||0);
    const cad=kos*(1+d.markup/100);
    h+='<section class="card" style="border:2px solid var(--b);gap:12px"><h2>'+(e.baru?'Kitab baru':esc(e.judul))+'</h2>'
     +(e.baru?'<label class="f">Judul<input class="inp" data-in="ke" data-k="judul" value="'+esc(e.judul)+'"></label>':'')
     +'<div class="row"><label class="f" style="flex:1 1 140px">Harga di Mesir (LE)<input class="inp" type="number" inputmode="decimal" data-in="ke" data-k="le" value="'+esc(e.le)+'"></label><label class="f" style="flex:1 1 160px">Berat<select class="inp" data-in="ke" data-k="berat"><option value="ringan" '+(e.berat!=='berat'?'selected':'')+'>500 g ke bawah</option><option value="berat" '+(e.berat==='berat'?'selected':'')+'>500 g – 1 kg</option></select></label></div>'
     +'<div class="note n-n">Kos kitab: <b>'+rm(kos)+'</b> · harga jual cadangan (markup '+d.markup+'%): <b>'+rm(cad)+'</b></div>'
     +'<label class="f">Harga jual (RM)<input class="inp" type="number" inputmode="decimal" step="0.01" data-in="ke" data-k="hargaJual" value="'+esc(e.hargaJual)+'"></label>'
     +'<div class="row"><button class="btn p" data-act="katSave">Simpan</button><button class="btn" data-act="katCancel">Batal</button></div></section>';
  }
  h+='<section class="box">'+(rows.length?rows.map(r=>'<div class="li" style="justify-content:space-between"><div style="flex:1 1 200px;min-width:0"><b style="font-size:14px">'+esc(r.judul)+'</b><div class="sub">Harga jual '+rm(r.hargaJual)+' · kos '+(r.kos>0?rm(r.kos):'<span class="tag t-a">belum ada</span>')+'</div></div><button class="btn sm" data-act="katEdit" data-j="'+esc(r.judul)+'">'+(r.kos>0?'Ubah':'Isi kos')+'</button></div>').join(''):'<div class="li sub">Katalog kosong. Import Wasepme akan tambah judul secara automatik.</div>')+'</section>';
  return h;
}

/* ---------- tindakan ---------- */
const ACT = {
  login, logout(){ S.user=null; S.pin=''; try{localStorage.removeItem('hpr_pin');}catch(e){} render(); },
  go(el){ go(el.dataset.p); },
  semak(){ S.tx.filter='semak'; go('tunai'); },
  bankin(){ $('bankin').classList.toggle('hide'); },
  async bankinSave(){ const v=$('bankinAmt').value; try{ await run(call('api_saveTx',S.pin,{jenis:'pindahan',jumlah:v,bank:'Tunai',bankKe:'Maybank',kategori:'Bank-in tunai',tarikh:S.boot.today})); toast('Bank-in direkod'); go('utama'); }catch(e){} },
  rekodTab(el){ S.R=newRekod(el.dataset.t); if(S.page!=='rekod'){ S.page='rekod'; render(); } else repaint(); },
  setR(el){ S.R[el.dataset.k]=el.dataset.v; repaint(); },
  setCat(el){ const R=S.R; R.kategori=el.dataset.v; const c=S.boot.outCats.find(x=>x.k===R.kategori); R.bank=R.tab==='keluar'?(c?c.bank:''):'Maybank'; repaint(); },
  qty(el){ const R=S.R, j=el.dataset.j; R.items[j]=Math.max(0,(R.items[j]||0)+Number(el.dataset.d)); repaint(); },
  addExtra(){ const j=$('exJ').value.trim(), hgt=Number($('exH').value), q=Number($('exQ').value)||1; if(!j||!(hgt>0)) return toast('Isi judul dan harga'); S.R.extra.push({judul:j,harga:hgt,q}); repaint(); },
  delExtra(el){ S.R.extra.splice(+el.dataset.i,1); repaint(); },
  rekodBack(){ S.R.step--; S.R.tried=false; repaint(); },
  rekodNext(){ const R=S.R; if(!rekodValid()){ R.tried=true; repaint(); return; } R.tried=false; if(R.step<3){ R.step++; repaint(); } else rekodSave(); },
  rekodAgain(){ S.R=newRekod(S.R.tab); repaint(); },
  txf(el){ S.tx.filter=el.dataset.v; repaint(); },
  txo(el){ S.tx.open=S.tx.open===el.dataset.id?null:el.dataset.id; repaint(); },
  async fixBank(el){ try{ await run(call('api_completeTx',S.pin,el.dataset.id,{bank:$('fixBank').value})); toast('Dikemas kini'); go('tunai'); }catch(e){} },
  async fixDone(el){ try{ await run(call('api_completeTx',S.pin,el.dataset.id,{selesai:true})); toast('Ditanda selesai'); go('tunai'); }catch(e){} },
  impReset(){ S.imp=null; repaint(); },
  async impCommit(){ const I=S.imp; try{ I.done=await run(call('api_commitImport',S.pin,I.orders,I.includePos)); repaint(); }catch(e){} },
  async agSave(){ const A=S.ag; if(!A.confirm){ A.confirm=true; repaint(); return; } try{ A.done=await run(call('api_saveAgihan',S.pin,A.untung)); repaint(); }catch(e){ A.confirm=false; } },
  katNew(){ S.kat.edit={baru:true,judul:'',le:'',berat:'ringan',hargaJual:'',kos:0}; repaint(); },
  katEdit(el){ const r=S.data.kat.rows.find(x=>x.judul===el.dataset.j); S.kat.edit={judul:r.judul,le:r.le,berat:r.berat||'ringan',hargaJual:r.hargaJual,kos:r.kos}; repaint(); window.scrollTo(0,0); },
  katCancel(){ S.kat.edit=null; repaint(); },
  async katSave(){
    const d=S.data.kat, e=S.kat.edit;
    if(!String(e.judul).trim()) return toast('Isi judul');
    const kos=e.le!==''&&Number(e.le)>0?(Number(e.le)/d.rate+(e.berat==='berat'?d.posBerat:d.posRingan)):Number(e.kos||0);
    try{ const r=await run(call('api_saveKatalog',S.pin,{judul:e.judul,le:e.le,berat:e.berat,kos:kos,hargaJual:e.hargaJual||kos*(1+d.markup/100)})); toast('Disimpan'+(r.dibetulkan?' · '+r.dibetulkan+' jualan dikemas kini':'')); S.kat.edit=null; S.data.kat=await call('api_katalog',S.pin); const b=await call('api_login',S.pin); S.boot.katalog=b.katalog; repaint(); }catch(e2){}
  }
};
document.addEventListener('click',e=>{ const el=e.target.closest('[data-act]'); if(!el) return; const f=ACT[el.dataset.act]; if(f){ e.preventDefault(); f(el,e); } });
document.addEventListener('keydown',e=>{ if(e.key==='Enter'&&e.target.id==='pin') login(); });

function refocus(sel,el){ let pos=null; try{ pos=el.selectionStart; }catch(e){} repaint(); const n=document.querySelector(sel); if(n){ n.focus(); try{ if(pos!=null) n.setSelectionRange(pos,pos); }catch(e){} } }
const IN = {
  rq(el){ S.R.q=el.value; refocus('[data-in="rq"]',el); },
  kq(el){ S.kat.q=el.value; refocus('[data-in="kq"]',el); },
  jumlah(el){ S.R.jumlah=el.value; }, tarikh(el){ S.R.tarikh=el.value; }, keterangan(el){ S.R.keterangan=el.value; }, diskaun(el){ S.R.diskaun=el.value; },
  agU(el){ S.ag.untung=el.value; S.ag.confirm=false; refocus('[data-in="agU"]',el); },
  ke(el){ S.kat.edit[el.dataset.k]=el.value; if(el.dataset.k==='le') refocus('[data-in="ke"][data-k="le"]',el); else if(el.dataset.k==='berat') repaint(); },
  rec(el){ const b=el.dataset.b, sys=S.data.tx.baki[b], tag=$('rec-'+b.replace(/\s/g,'_')); if(el.value===''){ tag.className='tag t-n'; tag.textContent='—'; return; } const diff=Math.round((Number(el.value)-sys)*100)/100; if(Math.abs(diff)<0.01){ tag.className='tag t-g'; tag.textContent='Sepadan'; } else { tag.className='tag t-r'; tag.textContent='Beza '+rm(diff); } }
};
document.addEventListener('input',e=>{ const k=e.target.dataset&&e.target.dataset.in; if(k&&IN[k]&&e.target.type!=='file'&&e.target.type!=='checkbox'&&e.target.type!=='month'&&e.target.tagName!=='SELECT') IN[k](e.target); });
document.addEventListener('change',async e=>{
  const el=e.target, k=el.dataset&&el.dataset.in; if(!k) return;
  if(k==='resit'){ try{ busy(true); S.R.resit=await readReceipt(el.files[0]); S.R.resitName=el.files[0]?el.files[0].name:''; }catch(er){ toast(er.message); } finally{ busy(false); } repaint(); }
  if(k==='fixResit'){ try{ const r=await readReceipt(el.files[0]); await run(call('api_completeTx',S.pin,el.dataset.id,{resit:r})); toast('Resit disimpan'); go('tunai'); }catch(er){} }
  if(k==='month'){ S.tx.month=el.value; go('tunai'); }
  if(k==='ke'&&el.tagName==='SELECT'){ IN.ke(el); }
  if(k==='impPos'){ S.imp.includePos=el.checked; impPreview(); }
  if(k==='impFile'){
    const f=el.files[0]; if(!f) return;
    try{ busy(true); const text=await f.text(); const orders=parseWasepme(text); if(!orders.length) throw new Error('Tiada pesanan dalam fail.'); S.imp={fileName:f.name, orders, includePos:false, preview:null, done:null}; }catch(er){ busy(false); toast(er.message); return; }
    busy(false); impPreview();
  }
});

render();
if(S.pin) login();
</script>
</body>
</html>
