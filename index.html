<style>
:root{--b:#064C7D;--bs:#E6EEF6;--ink:#111827;--mut:#4B5563;--line:#E5E7EB;--soft:#F3F4F6;--g:#15803D;--gs:#DCFCE7;--r:#B91C1C;--rs:#FEE2E2;--a:#9A3412;--as:#FFEDD5;--y:#78350F;--ys:#FEF3C7}
*{box-sizing:border-box}
body{margin:0;font-family:Poppins,system-ui,sans-serif;color:var(--ink);background:#fff;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--b)}
.shell{display:flex;min-height:100vh}
.side{width:250px;flex:none;border-right:1px solid var(--line);padding:24px 16px;display:flex;flex-direction:column;gap:22px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px}
.brand img{width:38px;height:40px;object-fit:contain}
.brand b{display:block;font-size:15px}.brand small{color:var(--mut);font-size:12px}
.nav{display:flex;flex-direction:column;gap:4px}
.nav button{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 12px;border:0;border-radius:8px;background:none;font-size:15px;font-weight:500;color:#374151;text-align:left}
.nav button.on{background:var(--bs);color:var(--b);font-weight:600}
.side .who{margin-top:auto;font-size:13px;color:var(--mut);display:flex;flex-direction:column;gap:8px}
.main{flex:1;min-width:0;padding:32px 40px 48px;display:flex;flex-direction:column;gap:22px;max-width:1100px}
.top{display:none}
.bnav{display:none}
h1{margin:0;font-size:24px}h2{margin:0;font-size:17px}h3{margin:0;font-size:15px}
.sub{color:var(--mut);font-size:14px}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.between{justify-content:space-between}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.card{border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:6px}
.card .lbl{font-size:13px;color:var(--mut)}
.card .val{font-size:22px;font-weight:700}
.box{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.box>.hd{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.li{padding:12px 18px;border-top:1px solid #F3F4F6;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.li:first-child{border-top:0}
.li[style*="flex-direction:column"]{flex-wrap:nowrap}
.btn{min-height:48px;padding:0 20px;border-radius:10px;border:1px solid #D1D5DB;background:#fff;font-weight:600;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;color:var(--ink)}
.btn.p{background:var(--b);border-color:var(--b);color:#fff}
.btn.g{background:var(--g);border-color:var(--g);color:#fff}
.btn.r{background:var(--r);border-color:var(--r);color:#fff}
.btn.sm{min-height:38px;padding:0 12px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.55;cursor:default}
.chip{min-height:38px;padding:0 14px;border-radius:999px;border:1px solid #D1D5DB;background:#fff;font-size:14px;font-weight:600}
.chip.on{background:var(--b);border-color:var(--b);color:#fff}
.tag{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600}
.t-g{background:var(--gs);color:#14532D}.t-r{background:var(--rs);color:#991B1B}.t-a{background:var(--as);color:var(--a)}.t-y{background:var(--ys);color:var(--y)}.t-n{background:var(--soft);color:#374151}.t-b{background:var(--bs);color:var(--b)}
.bar{height:10px;border-radius:999px;background:var(--soft);overflow:hidden}.bar>i{display:block;height:100%;border-radius:999px;background:var(--b)}
.inp{min-height:48px;width:100%;padding:0 12px;border:1px solid #D1D5DB;border-radius:10px;font-size:16px;background:#fff}
label.f{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:600}
.note{padding:12px 14px;border-radius:10px;font-size:14px;line-height:1.5}
.n-y{background:var(--ys);color:var(--y)}.n-r{background:var(--rs);color:#991B1B;font-weight:600}.n-n{background:var(--soft);color:#374151}.n-g{background:#F0FDF4;color:#14532D}
.amt-in{color:var(--g);font-weight:700}.amt-out{color:var(--r);font-weight:700}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{min-height:78px;padding:12px;border-radius:12px;border:2px solid var(--line);background:#fff;text-align:left;display:flex;flex-direction:column;justify-content:center;gap:3px}
.tile b{font-size:15px}.tile small{font-size:12px;color:var(--mut)}
.tile.on{border-color:var(--b);background:var(--bs)}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.steps i{height:6px;border-radius:999px;background:var(--line)}.steps i.on{background:var(--b)}
.form{max-width:520px;display:flex;flex-direction:column;gap:16px}
.qty{display:flex;align-items:center;gap:4px}.qty button{width:44px;height:44px;border-radius:10px;border:1px solid #D1D5DB;background:#fff;font-size:20px;font-weight:600}.qty button.plus{background:var(--b);border-color:var(--b);color:#fff}.qty span{min-width:28px;text-align:center;font-weight:700}
.big{font-size:32px;font-weight:700}
.tbl{overflow-x:auto}.tbl table{width:100%;border-collapse:collapse;font-size:14px;min-width:720px}.tbl th{text-align:left;color:var(--mut);font-weight:500;padding:10px 12px}.tbl td{padding:10px 12px;border-top:1px solid #F3F4F6;vertical-align:top}
.load{position:fixed;inset:0;background:rgba(255,255,255,.7);display:none;align-items:center;justify-content:center;z-index:50;font-weight:600}
.load.on{display:flex}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#111827;color:#fff;padding:12px 18px;border-radius:10px;font-size:14px;z-index:60;max-width:90vw;display:none}
.toast.on{display:block}
.login{max-width:360px;margin:12vh auto;padding:24px;display:flex;flex-direction:column;gap:16px;text-align:center}
.login img{width:72px;height:76px;margin:0 auto}
.hide{display:none!important}
#slipView{position:fixed;inset:0;background:rgba(17,24,39,.55);z-index:40;overflow:auto;padding:24px 12px}
#slipView .slipwrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.slip{background:#fff;color:#111827;border-radius:8px;padding:28px;display:flex;flex-direction:column;gap:18px;font-size:13px}
.slip table{width:100%;border-collapse:collapse}.slip td{padding:7px 10px;border-bottom:1px solid #F3F4F6}.slip td:last-child{text-align:right}
.slip .hdrow{background:#F3F4F6;font-weight:700}
.resit{max-width:340px;margin:0 auto;font-size:13px;gap:10px;padding:22px 20px}
.resit .dash{border-top:1px dashed #9CA3AF}
@media print{ body.printing-slip .resit{max-width:72mm;padding:0;font-size:11.5px} }
.surat{font-size:13.5px;line-height:1.65;gap:14px;padding:40px 48px}
.surat table{font-size:inherit;line-height:inherit}.surat td{text-align:left!important;border:0!important}
@media (max-width:760px){ .surat{padding:22px 18px} .surat div[style*=justify]{text-align:left!important} }
@media print{ @page{size:A4;margin:16mm} body.printing-slip .surat{padding:0;font-size:12.5px} }
.nav{overflow-y:auto;min-height:0;flex:1 1 auto}
.nav .sec{font-size:11px;letter-spacing:1.2px;text-transform:uppercase;color:var(--mut);font-weight:600;padding:16px 12px 4px}
.mB .nav{gap:1px}.mB .nav button{min-height:34px;font-size:14px}.mB .nav .sec{padding:10px 12px 2px}.mB.shell .side{gap:16px;padding:20px 14px}
.sectitle{font-size:12px;letter-spacing:1.2px;text-transform:uppercase;color:var(--mut);font-weight:700;padding:0 4px}
.menurow{width:100%;border:0;border-top:1px solid #F3F4F6;background:#fff;text-align:left;cursor:pointer;font:inherit;min-height:64px}
.mic{flex:none;width:40px;height:40px;border-radius:10px;background:var(--bs);color:var(--b);display:flex;align-items:center;justify-content:center}
.bnav button.mid .mic2{width:50px;height:50px;border-radius:999px;background:var(--b);color:#fff;display:flex;align-items:center;justify-content:center;margin-top:-22px;box-shadow:0 4px 14px rgba(6,76,125,.35)}
.tophd{display:none}
.mC{flex-direction:column}.mC .side{display:none}
.mC .tophd{display:flex;align-items:center;gap:18px;padding:12px 32px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:6;flex-wrap:wrap}
.tophd nav{display:flex;gap:4px;flex:1;flex-wrap:wrap}
.tophd nav button{min-height:40px;padding:0 14px;border:0;border-radius:999px;background:none;font-weight:600;font-size:14px;color:#374151;display:flex;gap:8px;align-items:center}
.tophd nav button.on{background:var(--bs);color:var(--b)}
.mC .main{margin:0 auto;width:100%}
.crumb{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--mut)}.crumb button{border:0;background:none;font-weight:600;color:var(--b);padding:6px 0;min-height:36px}
.hub{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.hubc{border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;background:#fff}
.hubc .hh{display:flex;gap:12px;align-items:center;border:0;background:none;padding:0;width:100%;font:inherit;cursor:pointer;min-height:48px}
.hic{flex:none;width:44px;height:44px;border-radius:12px;background:var(--b);color:#fff;display:flex;align-items:center;justify-content:center}
.fab{display:none}
.klbl{font-size:12px;letter-spacing:.6px;text-transform:uppercase;color:var(--mut);font-weight:600}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{gap:4px}.kpi .val{font-size:20px}.kbtn{text-align:left;background:#fff;cursor:pointer;font:inherit}.kbtn:hover{border-color:#C7D7E6}
.arow{width:100%;border:0;border-top:1px solid #F3F4F6;background:#fff;text-align:left;cursor:pointer;font:inherit;min-height:56px;font-size:15px}
.dot{width:8px;height:8px;border-radius:999px;flex:none}
.qa{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.qbtn{align-items:center;text-align:center;background:#fff;cursor:pointer;font:inherit;gap:10px;padding:16px 8px;font-size:14px}
.hero1{background:#064C7D;color:#fff;border-radius:16px;padding:24px;display:flex;flex-wrap:wrap;gap:20px;align-items:center;justify-content:space-between}
.h1l{flex:1 1 320px;min-width:0;display:flex;flex-direction:column;gap:6px}.h1r{display:flex;flex-direction:column;align-items:center;gap:8px}
.hbig{font-size:38px;font-weight:700;line-height:1.15}.hsub{font-size:14px;color:#D6E4F0}
.spark{display:flex;align-items:flex-end;gap:3px;height:56px;margin-top:10px}.spark i{flex:1;background:#fff;border-radius:2px;min-width:3px}
.t1{gap:6px;text-align:left;background:#fff;font:inherit}.t1ic{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;margin-bottom:4px}button.t1{cursor:pointer}button.t1:hover{border-color:#C7D7E6}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;align-items:start}
.p2{display:flex;flex-direction:column;gap:22px;max-width:860px}
.p2big{font-size:44px;font-weight:700;letter-spacing:-.5px;line-height:1.15;margin-top:4px}
.p2line{position:relative;height:4px;background:var(--soft);border-radius:999px}.p2line i{position:absolute;left:0;top:0;bottom:0;background:var(--b);border-radius:999px}.p2line b{position:absolute;top:-6px;width:2px;height:16px;background:#111827;border-radius:1px}
.p2stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.p2stats>div{padding:16px 16px 16px 0;display:flex;flex-direction:column;gap:4px}.p2stats>div+div{border-left:1px solid var(--line);padding-left:16px}.p2stats b{font-size:19px}
.p2h{font-size:13px;letter-spacing:1.2px;text-transform:uppercase;color:var(--mut);margin:6px 0 -10px}
.p2list{display:flex;flex-direction:column}
.p2row{display:flex;align-items:center;gap:14px;padding:14px 2px;border:0;border-bottom:1px solid var(--line);background:none;font:inherit;text-align:left;cursor:pointer;min-height:60px;width:100%}
.p2tot{font-weight:700;border-bottom:0;border-top:2px solid #111827;cursor:default}
.dblk{flex:none;width:48px;height:52px;border-radius:10px;background:var(--bs);color:var(--b);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}.dblk b{font-size:19px}.dblk small{font-size:11px;font-weight:600;text-transform:uppercase}
.p2alert{display:flex;flex-direction:column;gap:6px}.p2a{display:flex;align-items:center;gap:10px;border:1px solid #FED7AA;background:#FFF7ED;border-radius:10px;padding:10px 14px;font:inherit;font-size:14px;text-align:left;cursor:pointer;min-height:44px}.p2a span:last-child{margin-left:auto;color:var(--mut)}
@media (max-width:760px){ .p2stats{grid-template-columns:repeat(2,minmax(0,1fr))} .p2stats>div:nth-child(3){border-left:0;padding-left:0;border-top:1px solid var(--line)} .p2stats>div:nth-child(4){border-top:1px solid var(--line)} .p2big{font-size:36px} .hbig{font-size:32px} .hero1{padding:20px} .h1r{width:100%;flex-direction:row;justify-content:center;gap:16px} }
.pdfwrap{position:relative;background:#E5E7EB;padding:8px;display:flex;flex-direction:column;gap:8px;max-height:78vh;overflow:auto;-webkit-overflow-scrolling:touch}.pdfwrap canvas{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.15);display:block}
.subtabs{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;margin-bottom:-8px;-webkit-overflow-scrolling:touch;scrollbar-width:none}.subtabs::-webkit-scrollbar{display:none}.subtabs .chip{flex:none}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .dow{font-size:12px;color:var(--mut);text-align:center;font-weight:600;padding:4px 0}
.cal button.day{min-height:78px;border:1px solid var(--line);border-radius:8px;background:#fff;padding:4px;display:flex;flex-direction:column;align-items:stretch;gap:3px;text-align:left;min-width:0}
.cal button.day.on{border:2px solid var(--b);background:#F5F9FD}
.cal .dn{font-size:13px;font-weight:600;width:24px;height:24px;border-radius:999px;display:flex;align-items:center;justify-content:center}
.cal .dn.today{background:var(--b);color:#fff}
.cal .ev{font-size:11px;font-weight:600;border-radius:4px;padding:1px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ty-Pameran{background:#E0ECF7;color:#064C7D}.ty-Kuliah{background:#EDE9FE;color:#5B21B6}.ty-Tempahan{background:#FFEDD5;color:#9A3412}.ty-Lain-lain{background:var(--soft);color:#374151}
.chk{display:flex;gap:12px;align-items:center;min-height:44px;font-size:15px;cursor:pointer}
.chk input{width:22px;height:22px;flex:none}
.chk.done span{text-decoration:line-through;color:var(--mut)}
.tl{display:flex;flex-direction:column;gap:0}
.tl .st{display:flex;gap:12px;align-items:flex-start;padding:8px 0}
.tl .dot{flex:none;width:28px;height:28px;border-radius:999px;border:2px solid #D1D5DB;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;background:#fff;color:var(--mut)}
.tl .dot.on{background:var(--b);border-color:var(--b);color:#fff}.tl .dot.stop{background:var(--r);border-color:var(--r);color:#fff}
@media (max-width:760px){ .cal{gap:2px} .cal button.day{min-height:58px;padding:2px} .cal .ev{font-size:9px;padding:0 2px} .cal .dn{font-size:12px;width:22px;height:22px} }
@media print{ body.printing-slip .shell,body.printing-slip .slipbar{display:none!important} body.printing-slip #slipView{position:static;background:none;padding:0} body.printing-slip .slip{border-radius:0;padding:0} }
@media print{ .side,.bnav,.top,.noprint,.toast,.load{display:none!important} .main{padding:0;max-width:none} .box,.card{break-inside:avoid} }
.printonly{display:none}@media print{.printonly{display:block}}
@media (max-width:760px){
  .side{display:none}
  .desk{display:none!important}
  .mC .tophd{display:none}
  .mC .bnav{display:none}
  .mC .fab{display:flex;position:fixed;right:16px;bottom:calc(20px + env(safe-area-inset-bottom));z-index:10;min-height:56px;padding:0 20px;border-radius:999px;border:0;background:var(--b);color:#fff;font-weight:700;font-size:15px;align-items:center;gap:8px;box-shadow:0 6px 18px rgba(6,76,125,.35)}
  .top{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:5}
  .shell{flex-direction:column}
  .main{padding:18px 16px 96px;gap:18px}
  .bnav{display:flex;position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:4px 4px calc(4px + env(safe-area-inset-bottom));z-index:10}
  .bnav button{flex:1;min-height:56px;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:500;color:var(--mut)}
  .bnav button.on{color:var(--b);font-weight:700}
  h1{font-size:21px}
}
</style>

function call(fn){
  const args=[].slice.call(arguments,1);

function readReceipt(file){
  return new Promise((ok,no)=>{
    if(!file) return ok(null);
    const fr=new FileReader();
    fr.onerror=()=>no(new Error('Gagal baca fail'));
    if(!/^image\//.test(file.type)){ fr.onload=()=>ok({name:file.name,mime:file.type||'application/pdf',data:String(fr.result).split(',')[1]}); fr.readAsDataURL(file); return; }
    fr.onload=()=>{ const img=new Image(); img.onload=()=>{ const max=1400; let w=img.width,h=img.height; if(Math.max(w,h)>max){ const k=max/Math.max(w,h); w=Math.round(w*k); h=Math.round(h*k);} const c=document.createElement('canvas'); c.width=w; c.height=h; c.getContext('2d').drawImage(img,0,0,w,h); ok({name:(file.name||'resit').replace(/\.\w+$/,'')+'.jpg',mime:'image/jpeg',data:c.toDataURL('image/jpeg',0.72).split(',')[1]}); }; img.onerror=()=>no(new Error('Gambar tidak dapat dibaca')); img.src=fr.result; };
    fr.readAsDataURL(file);
  });
}

/* ---------- baca fail SalesReport Wasepme ---------- */
function cleanCell(h){ return String(h).replace(/<br\s*\/?>/gi,' ').replace(/<[^>]+>/g,' ').replace(/&nbsp;/g,' ').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&#39;|&apos;/g,"'").replace(/&#(\d+);/g,(m,n)=>String.fromCharCode(+n)).replace(/\s+/g,' ').trim(); }
function money(v){ v=String(v||'').trim(); if(!v||v==='-') return 0; const n=parseFloat(v.replace(/RM/i,'').replace(/,/g,'').replace(/\s/g,'')); return isFinite(n)?n:0; }
function parseWasepme(text){
  const rows=[]; const trRe=/<tr[^>]*>([\s\S]*?)<\/tr>/gi; let m;
  while((m=trRe.exec(text))){ const cells=[]; const tdRe=/<t[dh][^>]*>([\s\S]*?)<\/t[dh]>/gi; let c; while((c=tdRe.exec(m[1]))) cells.push(cleanCell(c[1])); if(cells.length) rows.push(cells); }
  const hi=rows.findIndex(r=>r.indexOf('No. Pesanan')>-1);
  if(hi<0) throw new Error('Ini bukan fail SalesReport Wasepme (lajur "No. Pesanan" tiada).');
  const H=rows[hi]; const ix=n=>H.indexOf(n);
  const need=['Tarikh Pesanan','No. Pesanan','Status','Kaedah Pembayaran','Subjumlah','Jumlah Keseluruhan'];
  need.forEach(n=>{ if(ix(n)<0) throw new Error('Lajur "'+n+'" tiada dalam fail.'); });
  const out=[];
  rows.slice(hi+1).forEach(r=>{
    const g=n=>ix(n)>-1?(r[ix(n)]||''):'';
    const rawNo=g('No. Pesanan'); if(!rawNo||/^jumlah$/i.test(r[0])) return;
    const dm=g('Tarikh Pesanan').match(/(\d{1,2})\/(\d{1,2})\/(\d{4})\s+(\d{1,2}):(\d{2})(?::\d{2})?\s*(AM|PM)?/i);
    let tarikh='';
    if(dm){ let hh=+dm[4]; if(dm[6]){ const pm=/pm/i.test(dm[6]); if(pm&&hh<12) hh+=12; if(!pm&&hh===12) hh=0; } tarikh=dm[3]+'-'+('0'+dm[2]).slice(-2)+'-'+('0'+dm[1]).slice(-2)+'T'+('0'+hh).slice(-2)+':'+dm[5]; }
    const items=[]; const iRe=/(\d+)\s*x\s*(.+?)\s+RM\s*([\d,]+\.\d{2})/gi; let im; const resit=g('Resit');
    while((im=iRe.exec(resit))) items.push({q:+im[1], judul:im[2].trim(), jumlah:money(im[3])});
    const isPos=/\(POS\)/i.test(rawNo)||/point of sale/i.test(g('Kaedah Pengiriman'));
    const wa=g('No. WhatsApp'); const st=wa.match(/\(([^)]+)\)\s*$/);
    out.push({ no:rawNo.replace(/\s*\(POS\)\s*/i,'').trim(), tarikh, status:g('Status'), payment:g('Kaedah Pembayaran'),
      penghantaran:g('Kaedah Pengiriman'), subtotal:money(g('Subjumlah')), total:money(g('Jumlah Keseluruhan')),
      cost:money(g('Jumlah Kos')), items, isPos, oleh: st?st[1]:'' });
  });
  return out;
}

let flushing=false;
async function flushOutbox(){
  if(flushing||!S.outbox.length||!S.pin) return; flushing=true;
  let sent=0;
  while(S.outbox.length){
    try{ await call('api_saveTx',S.pin,S.outbox[0]); S.outbox.shift(); saveOutbox(); sent++; }
    catch(e){ if(isNet(e)) break; toast('Satu rekod ditolak: '+e.message); S.outbox.shift(); saveOutbox(); }
  }
  flushing=false;
  if(sent){ toast(sent+' rekod tertangguh dah dihantar ✓'); if(S.page==='utama') go('utama'); }
}
window.addEventListener('online',flushOutbox);

       +(R.kaedah==='Tunai'?'<div class="note n-y">Duit tunai mesti dimasukkan ke Maybank sebelum agihan 10hb / 25hb.</div>':'')
       +diskaunInfo(items,R)
       +'<label class="f">Diskaun (jika ada, RM)<input class="inp" type="number" inputmode="decimal" step="0.01" data-in="diskaun" value="'+esc(R.diskaun)+'"></label><div id="diskWarn">'+diskaunWarn(items,R)+'</div>'
       +'<label class="f">Tarikh<input class="inp" type="date" data-in="tarikh" value="'+esc(R.tarikh)+'"></label>'
       +'<label class="f">No. telefon pelanggan <span class="sub" style="font-weight:400">(untuk resit WhatsApp, tidak wajib)</span><input class="inp" type="tel" inputmode="tel" data-in="telefon" value="'+esc(R.telefon||'')+'" placeholder="0123456789"></label>'
       +'<label class="f">Bukti bayaran (QR / transfer)<input class="inp" type="file" accept="image/*,application/pdf" data-in="resit" style="padding-top:10px"></label>'+(R.resitName?'<div class="sub">✓ '+esc(R.resitName)+'</div>':'')
       +'<div class="note n-n row between" style="font-size:18px"><span>Jumlah dibayar</span><b>'+rm(total)+'</b></div>';

    const out=R.tab==='keluar';
    if(R.step===1){
      h+='<h2>'+(out?'Berapa duit keluar?':'Berapa duit masuk?')+'</h2><label class="f" style="font-weight:400"><span class="hide">Jumlah</span><input class="inp" type="number" inputmode="decimal" step="0.01" placeholder="RM 0.00" data-in="jumlah" value="'+esc(R.jumlah)+'" style="min-height:68px;font-size:30px;font-weight:700"></label>'
       +'<label class="f">Tarikh<input class="inp" type="date" data-in="tarikh" value="'+esc(R.tarikh)+'"></label>';
    }
    if(R.step===2){
      const cats=out?S.boot.outCats.map(c=>[c.k,c.grp+' · '+c.bank]):S.boot.inCats.map(c=>[c,'Masuk ke Maybank']);

      let warn='';
      if(R.bank&&R.bank!==want){ warn=R.bank.indexOf('OCBC')===0?'Jangan guna OCBC — itu duit Profit dan Cukai.':(out?(want==='Hong Leong'?'Belanja operasi mesti dibayar dari Hong Leong.':'Duit stok & pos (EasyParcel) dibayar dari Maybank sahaja.'):'Duit masuk sepatutnya ke Maybank.'); }
      h+='<h2>'+(out?'Dibayar dari bank mana?':'Masuk ke bank mana?')+'</h2><div class="tiles">'+banks.map(b=>'<button class="tile '+(R.bank===b?'on':'')+'" data-act="setR" data-k="bank" data-v="'+esc(b)+'"><b>'+esc(b)+'</b>'+(b===want?'<small>Dicadangkan</small>':'')+'</button>').join('')+'</div>'
       +(warn?'<div class="note n-r" role="alert">'+warn+'</div>':'')
       +'<label class="f">'+(out?'Snap resit':'Bukti bayaran')+'<input class="inp" type="file" accept="image/*,application/pdf" capture="environment" data-in="resit" style="padding-top:10px"></label>'+(R.resitName?'<div class="sub">✓ '+esc(R.resitName)+'</div>':'<div class="sub">Tanpa resit, rekod ditanda "perlu semak".</div>')

    }
  }
  const ok=rekodValid();
  h+=(R.tried&&!ok?'<div class="note n-y">Lengkapkan langkah ini dahulu.</div>':'')
   +'<div class="row">'+(R.step>1?'<button class="btn" data-act="rekodBack">Kembali</button>':'')+'<button class="btn '+(R.tab==='keluar'?'r':(R.tab==='masuk'?'g':'p'))+'" style="flex:1" data-act="rekodNext">'+(R.step<3?'Seterusnya':'Simpan')+'</button></div></div>';
  return h;
}
async function rekodSave(){
  const R=S.R;
  const rec={jenis:R.tab, tarikh:R.tarikh, keterangan:R.keterangan, resit:R.resit};
  if(R.tab==='jualan'){ Object.assign(rec,{items:rekodItems(), saluran:R.saluran, kaedah:R.kaedah, diskaun:R.diskaun}); if(R.saluran==='Event'&&R.program) rec.program=R.program; }
  else Object.assign(rec,{jumlah:R.jumlah, kategori:R.kategori, bank:R.bank});
  rec.cid='C'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  busy(true);
  try{ const d=await call('api_saveTx',S.pin,rec); R.done=d; R.done.telefon=R.telefon||''; R.done.diskaun=Number(R.diskaun||0); }
  catch(e){
    if(isNet(e)){ S.outbox.push(rec); if(saveOutbox()){ R.done={kategori:rec.kategori||'Jualan', jumlah:rec.jumlah||(rekodItems().reduce((a,i)=>a+i.q*i.harga,0)-Number(R.diskaun||0)), bendera:'', offline:true, items:rec.items||[], kaedah:rec.kaedah, saluran:rec.saluran, program:rec.program||'', tarikh:rec.tarikh, oleh:S.user.name, telefon:R.telefon||'', id:rec.cid, masa:new Date().toTimeString().slice(0,5)}; } else { S.outbox.pop(); toast('Tiada internet, dan telefon tak dapat simpan rekod ini. Cuba lagi.'); } }
    else toast(e.message);
  } finally { busy(false); }
  repaint();
}

/* ---------- DISKAUN IKUT SOP (M3) ---------- */
function hadDiskaun(q,inst){ if(inst||q>=20) return 15; if(q>=10) return 10; if(q>=5) return 5; return 0; }
function siapaLulus(p){ return p<=0?'tiada diskaun':(p<=5?'semua staf':(p<=10?'Pengurus Operasi':'Pengurus Utama')); }
function diskaunInfo(items,R){ const q=items.reduce((a,i)=>a+i.q,0), had=hadDiskaun(q,R.saluran==='Institusi'); return '<div class="note n-n" style="font-size:13px">Had diskaun SOP untuk <b>'+q+' naskhah</b>: <b>'+had+'%</b>'+(had?' ('+rm(items.reduce((a,i)=>a+i.q*i.harga,0)*had/100)+') · diluluskan oleh '+siapaLulus(had):'')+'</div>'; }
function diskaunWarn(items,R){ const sub=items.reduce((a,i)=>a+i.q*i.harga,0), q=items.reduce((a,i)=>a+i.q,0), had=hadDiskaun(q,R.saluran==='Institusi'), p=sub?Number(R.diskaun||0)/sub*100:0; return p>had+0.5?'<div class="note n-r">Diskaun '+Math.round(p)+'% melebihi had SOP '+had+'%. Perlu kelulusan Pengurus Utama. Rekod akan ditanda "perlu semak".</div>':''; }

const BERAT_CEPAT=[250,500,800,1000,1500,2000,3000,5000,10000,15000,20000];
function kgVal(g){ g=Number(g); return g?String(Math.round(g)/1000):''; }
function beratTxt(g){ g=Number(g); if(!g) return ''; return g>=1000?(Math.round(g/10)/100)+' kg':Math.round(g)+' g'; }
function posFor(g,p){ const kg=Math.ceil((Number(g)/1000)/p.step-1e-9)*p.step; return {kg:Math.round(kg*100)/100, kos:Math.round(kg*p.perKg*100)/100}; }
function hargaBundar(kos,markup){ const v=Number(kos||0)*(1+Number(markup||0)/100); return v>0?Math.ceil(v-1e-9):0; }
function kosCalc(e,d){ const le=Number(e.le), g=Number(e.berat); if(g>20000) return {kos:0,pos:null,err:'Berat maksimum ialah 20 kg.'}; if(e.le===''||!(le>0)||!(g>0)) return {kos:Number(e.kos||0), pos:null, err:''}; const p=posFor(g,d.pos); return {kos:le/d.rate+p.kos, pos:p, err:''}; }
function kadarBox(d){

/* ---------- LAPORAN ---------- */
function barChart(vals, target){
  const n=vals.length, W=Math.max(320,n*22+40), H=200, pad=28, max=Math.max(1,...vals,target||0)*1.1;
  const bw=(W-pad-8)/n;
  let g='<svg viewBox="0 0 '+W+' '+(H+24)+'" style="width:100%;min-width:'+Math.min(W,560)+'px;height:auto" role="img" aria-label="Jualan harian">';
  [0,0.5,1].forEach(f=>{ const y=H-(H-10)*f; g+='<line x1="'+pad+'" x2="'+W+'" y1="'+y+'" y2="'+y+'" stroke="var(--line)"/><text x="'+(pad-4)+'" y="'+(y+4)+'" font-size="10" text-anchor="end" fill="var(--mut)">'+(f?Math.round(max*f/1.1/100)/10+'k':'0')+'</text>'; });
  vals.forEach((v,i)=>{ const h=(H-10)*v/max, x=pad+i*bw+2; g+='<rect x="'+x+'" y="'+(H-h)+'" width="'+Math.max(2,bw-4)+'" height="'+h+'" rx="3" fill="var(--b)"><title>'+(i+1)+'hb: '+rm(v)+'</title></rect>'; if((i+1)%5===0||i===0) g+='<text x="'+(x+(bw-4)/2)+'" y="'+(H+16)+'" font-size="10" text-anchor="middle" fill="var(--mut)">'+(i+1)+'</text>'; });
  if(target){ const y=H-(H-10)*target/max; g+='<line x1="'+pad+'" x2="'+W+'" y1="'+y+'" y2="'+y+'" stroke="var(--a)" stroke-dasharray="5 4"/><text x="'+W+'" y="'+(y-4)+'" font-size="10" text-anchor="end" fill="var(--a)">sasaran sehari</text>'; }
  return g+'</svg>';
}
function laporanHtml(){
  const d=S.data.lap;
  let h='<div class="row between"><div><h1>Laporan</h1><div class="sub">Untung rugi &amp; jualan bulanan</div></div><div class="row noprint"><input class="inp" type="month" data-in="lapMonth" value="'+esc(S.lap.month||(d&&d.bulan)||'')+'" aria-label="Bulan" style="width:auto"><button class="btn" data-act="print">Cetak / PDF</button></div></div>';
  if(!d) return h+'<div class="sub">Memuatkan…</div>';
  const t=d.pelan.target||0, pct=t?Math.round(d.jualan/t*100):0;

function setGaji(d){ S.data.gj=d; S.gj.month=d.bulan; S.gj.rows=JSON.parse(JSON.stringify(d.rows)); }
function r2(n){ return Math.round((Number(n)||0)*100)/100; }
function calcG(r,rt){
  const asas=r.unit==='bulan'?r2(r.gajiAsas):r2((+r.hari||0)*(+r.kadar||0));
  const kasar=r2(asas+(+r.elaun||0)+(+r.komisen||0));
  const o={gajiAsas:asas,kasar:kasar};
  if(r.manual){ ['kwspP','perkesoP','sipP','kwspM','perkesoM','sipM'].forEach(k=>o[k]=r2(r[k])); }
  else { const pct=(on,p)=>on?r2(kasar*p/100):0; o.kwspP=pct(r.kwsp,rt.kwspP); o.kwspM=pct(r.kwsp,rt.kwspM); o.perkesoP=pct(r.perkeso,rt.perkesoP); o.perkesoM=pct(r.perkeso,rt.perkesoM); o.sipP=pct(r.perkeso,rt.sipP); o.sipM=pct(r.perkeso,rt.sipM); }
  o.pcb=r2(r.pcb); o.potongan=r2(o.kwspP+o.perkesoP+o.sipP+o.pcb+(+r.pendahuluan||0)+(+r.potonganLain||0)); o.bersih=r2(kasar-o.potongan);
  return o;
}

const HARI=['Isn','Sel','Rab','Kha','Jum','Sab','Ahd'];
const BLN=['Jan','Feb','Mac','Apr','Mei','Jun','Jul','Ogo','Sep','Okt','Nov','Dis'];
function tglTxt(d){ if(!d) return ''; const p=String(d).split('-'); return (+p[2])+' '+BLN[(+p[1]||1)-1]+' '+p[0]; }
function tarikhJulat(a,b){ if(!a) return ''; if(!b||a===b) return tglTxt(a); const pa=a.split('-'), pb=b.split('-'); if(pa[0]===pb[0]&&pa[1]===pb[1]) return (+pa[2])+'–'+tglTxt(b); return tglTxt(a)+' – '+tglTxt(b); }
function addDaysC(ymd,n){ const p=String(ymd).split('-'); const d=new Date(+p[0],+p[1]-1,+p[2]+n); return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2); }

function progOn(p,day){ return p.mula<=day && p.akhir>=day; }
function targetStatus(j,t){ if(!t) return ['Tiada target','t-n']; if(j>t*1.02) return ['Terlebih target','t-b']; if(j>=t) return ['Target dicapai','t-g']; return ['Kurang target','t-a']; }

const BLN_PENUH=['Januari','Februari','Mac','April','Mei','Jun','Julai','Ogos','September','Oktober','November','Disember'];
function tglPenuh(d){ if(!d) return ''; const p=String(d).split('-'); return (+p[2])+' '+BLN_PENUH[(+p[1]||1)-1]+' '+p[0]; }
function julatPenuh(a,b){ if(!a) return ''; if(!b||a===b) return tglPenuh(a); return tglPenuh(a)+' hingga '+tglPenuh(b); }
function rmT(n){ return 'RM'+Number(n||0).toLocaleString('en-MY',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function lines(t){ return String(t||'').split('\n').map(x=>x.replace(/^[-•\s]+/,'').trim()).filter(Boolean); }
function abc(arr){ return arr.map((x,i)=>'('+String.fromCharCode(97+i)+') '+x).join('\n'); }
function nmCo(ctx){ return String(ctx.syarikat.nama||'').replace(/\b\w+/g,w=>w[0]+w.slice(1).toLowerCase()); }
function intro(co){ return 'Sukacita dimaklumkan bahawa '+co.nama.replace(/\b\w+/g,w=>w[0]+w.slice(1).toLowerCase())+' (No. SSM '+co.noDaftar+') ialah syarikat yang membekalkan kitab-kitab Arab muktabar yang diimport terus dari Mesir, merangkumi bidang fiqh, usul fiqh, hadis, akidah dan bahasa Arab.'; }
function tutup(ctx,e){ const co=ctx.syarikat; return 'Segala pertimbangan dan kerjasama pihak tuan/puan amatlah kami hargai dan didahului dengan ucapan terima kasih. Sebarang pertanyaan boleh diajukan kepada '+(e.ttd||'pihak kami')+' di talian '+co.telefon+(co.email?' atau emel '+co.email:'')+'.'; }

function suratBody(isi){
  const paras=String(isi||'').split(/\n\s*\n/).map(x=>x.trim()).filter(Boolean);
  let n=1;
  return paras.map((p,i)=>{
    const ls=p.split('\n'); let num='';
    if(i>0 && ls[0].charAt(0)!=='>'){ n++; num=n+'.'; } else if(i===0) n=1;
    ls[0]=ls[0].replace(/^>\s*/,'');
    let first=[], items=[];
    ls.forEach(l=>{ if(/^\([a-z]\)\s/.test(l.trim())) items.push(l.trim()); else if(items.length) items[items.length-1]+=' '+l.trim(); else first.push(l); });
    const rows=items.map(it=>{ const m=it.match(/^\(([a-z])\)\s*(.*)$/); const kv=m[2].match(/^(.{1,40}?)\s:\s(.*)$/);
      return '<tr><td style="width:30px;vertical-align:top;padding:2px 0">('+m[1]+')</td>'+(kv?'<td style="width:38%;vertical-align:top;padding:2px 8px 2px 0">'+esc(kv[1])+'</td><td style="vertical-align:top;padding:2px 0">: '+esc(kv[2])+'</td>':'<td colspan="2" style="vertical-align:top;padding:2px 0">'+esc(m[2])+'</td>')+'</tr>'; }).join('');
    return '<div style="display:flex;gap:10px;margin:0 0 12px"><div style="flex:none;width:24px">'+num+'</div><div style="flex:1;min-width:0;text-align:justify">'+first.map(esc).join('<br>')+(rows?'<table style="width:100%;border-collapse:collapse;margin-top:6px;text-align:left">'+rows+'</table>':'')+'</div></div>';
  }).join('');
}

function resitNo(t){ const d=String(t.tarikh||'').replace(/-/g,''); return 'R'+d+'-'+String(t.id||'').slice(-4).toUpperCase(); }
function progNama(id){ if(!id) return ''; const l=(S.boot&&S.boot.program)||[]; const p=l.find(x=>x.id===id); if(p) return p.nama; const k=S.data.kal&&S.data.kal.rows.find(x=>x.id===id); return k?k.nama:''; }
function resitData(t){
  const items=(t.items||[]).map(i=>({judul:i.judul,q:Number(i.q)||0,harga:Number(i.harga)||0}));
  const sub=items.reduce((a,i)=>a+i.q*i.harga,0);
  const disk=Math.max(0,Math.round((sub-Number(t.jumlah||0))*100)/100);
  let kaedah=t.kaedah||''; if(/qr/i.test(kaedah)) kaedah='QR'; else if(/tunai/i.test(kaedah)) kaedah='Tunai';
  return {no:resitNo(t), tarikh:t.tarikh, masa:t.masa||'', items, sub, disk, jumlah:Number(t.jumlah||0), kaedah, saluran:t.saluran||'', program:progNama(t.program), oleh:t.oleh||'', telefon:t.telefon||'', offline:!!t.offline};
}

function tugasList(d){
  const role=S.user.role, today=(S.boot&&S.boot.today)||'', p=today.split('-'), hari=+p[2], dow=new Date(+p[0],+p[1]-1,+p[2]).getDay(), T=(d&&d.tugas)||{};

    if(T.susulan) L.push(['sus','Susulan bayaran institusi ('+T.susulan+' invois)','go','invois']);

    if(d&&(!d.semakKadar||(new Date(today)-new Date(d.semakKadar))/86400000>90)) L.push(['kadar','Semak kadar tukaran LE (setiap 3 bulan)','go','katalog']);
    const nx=n=>{ for(let i=1;i<=3;i++){ const dt=new Date(+p[0],+p[1]-1,hari+i); if(n.indexOf(dt.getDate())>-1) return {i,dt}; } return null; };
    const a=nx([10,25]); if(a) soon.push((a.i===1?'Esok':'Dalam '+a.i+' hari')+': agihan Profit First &amp; import Wasep.me');
    const g=nx([1]); if(g) soon.push((g.i===1?'Esok':'Dalam '+g.i+' hari')+': bayar gaji staf');
  }
  if(role==='operasi'){
    L.push(['pos','Bungkus & pos pesanan "Baru" sebelum 3 petang','','']);
    L.push(['track','Hantar no. tracking kepada setiap pelanggan','go','templat']);
    L.push(['inbox','Jawab inbox & komen dalam 2 jam','go','templat']);
    (T.perluTutup||[]).forEach(e=>L.push(['tt'+e.id,'Tutup event: '+e.nama+' — kira stok, tunai & import POS','go','kalendar']));
    if(T.kargoSampai) L.push(['kargo',T.kargoSampai+' kargo dalam perjalanan — semak bila sampai','go','beli']);
  }
  return {L,soon};
}

  async impBuang(){ const I=S.imp; if(!I.bConfirm){ I.bConfirm=true; repaint(); return; } I.bConfirm=false; try{ I.buangRes=await run(call('api_buangBerulang',S.pin)); I.preview=await call('api_previewImport',S.pin,I.orders,I.includePos); repaint(); }catch(e){ repaint(); } },
  async impCommit(){ const I=S.imp; try{ I.done=await run(call('api_commitImport',S.pin,I.orders,I.includePos)); repaint(); }catch(e){} },
  async agBonus(){ const A=S.ag; if(!A.bConfirm){ A.bConfirm=true; repaint(); return; } try{ A.bDone=await run(call('api_saveBonus',S.pin,A.bonus)); repaint(); }catch(e){ A.bConfirm=false; } },
  async agSave(){ const A=S.ag; if(!A.confirm){ A.confirm=true; repaint(); return; } try{ A.done=await run(call('api_saveAgihan',S.pin,A.untung)); repaint(); }catch(e){ A.confirm=false; } },
  katNew(){ S.kat.edit={baru:true,judul:'',le:'',berat:'',hargaJual:'',kos:0}; repaint(); window.scrollTo(0,0); },
  katEdit(el){ const r=S.data.kat.rows.find(x=>x.judul===el.dataset.j); S.kat.edit={judul:r.judul,le:r.le,berat:r.berat||'',hargaJual:r.hargaJual,kos:r.kos}; repaint(); window.scrollTo(0,0); },
  katBerat(el){ S.kat.edit.berat=el.dataset.g; S.kat.edit.beratKg=null; repaint(); },
  katCancel(){ S.kat.edit=null; repaint(); },
  async katSave(){
    const d=S.data.kat, e=S.kat.edit;
    if(!String(e.judul).trim()) return toast('Isi judul');
    const c=kosCalc(e,d); if(c.err) return toast(c.err);
    try{ const r=await run(call('api_saveKatalog',S.pin,{judul:e.judul,le:e.le,berat:e.berat,kos:c.kos,hargaJual:e.hargaJual||hargaBundar(c.kos,d.markup)})); toast('Disimpan'+(r.dibetulkan?' · '+r.dibetulkan+' jualan dikemas kini':'')); S.kat.edit=null; S.data.kat=await call('api_katalog',S.pin); cacheSet('kat',S.data.kat); S.boot.katalog=S.data.kat.rows.map(k=>({judul:k.judul,harga:k.hargaJual})); repaint(); }catch(e2){}
  },
  async kadarSave(){ const v=($('kadarIn')||{}).value; try{ S.data.kat=await run(call('api_saveKadar',S.pin,v)); cacheSet('kat',S.data.kat); toast('Kadar disimpan & ditanda disemak'); repaint(); }catch(e){} },
  async posSave(){ const d=S.data.kat; const P=S.kat.pos||d.pos; try{ d.pos=await run(call('api_savePos',S.pin,{perKg:P.perKg,step:P.step})); S.kat.pos=null; cacheSet('kat',d); toast('Kadar pos disimpan'); repaint(); }catch(e){} },
  async fixKat(el){ try{ await run(call('api_completeTx',S.pin,el.dataset.id,{gunaKatalog:true})); toast('Kos dikemas kini dari Katalog'); go('tunai'); }catch(e){} },
  flush(){ flushOutbox(); },
  print(){ window.print(); },
  pkf(el){ S.pk.filter=el.dataset.v; repaint(); },
  pkNew(){ S.pk.edit={nama:'',jenis:'Tetap',unit:'bulan',status:'Aktif',kwsp:false,perkeso:false,pcb:false,kadar:'',dokumen:[]}; repaint(); window.scrollTo(0,0); },
  pkEdit(el){ const r=S.data.pk.rows.find(x=>x.id===el.dataset.id); S.pk.edit=JSON.parse(JSON.stringify(r)); repaint(); window.scrollTo(0,0); },
  pkCancel(){ S.pk.edit=null; repaint(); },
  async pkSave(){ const e=S.pk.edit; if(!String(e.nama||'').trim()) return toast('Isi nama pekerja'); try{ S.data.pk=await run(call('api_savePekerja',S.pin,e)); S.pk.edit=null; toast('Pekerja disimpan'); repaint(); }catch(er){} },
  async pkDokDel(el){ const e=S.pk.edit; try{ S.data.pk=await run(call('api_savePekerja',S.pin,Object.assign({},e,{buangDok:+el.dataset.i}))); S.pk.edit=JSON.parse(JSON.stringify(S.data.pk.rows.find(x=>x.id===e.id))); toast('Dokumen dibuang'); repaint(); }catch(er){} },
  async gjPrep(){ try{ setGaji(await run(call('api_prepareGaji',S.pin,S.gj.month))); repaint(); }catch(e){} },
  async gjSave(){ try{ setGaji(await run(call('api_saveGaji',S.pin,S.gj.month,S.gj.rows))); toast('Draf disimpan'); repaint(); }catch(e){} },
  async gjConfirm(){ try{ await call('api_saveGaji',S.pin,S.gj.month,S.gj.rows); setGaji(await run(call('api_statusGaji',S.pin,S.gj.month,'Disahkan'))); toast('Gaji disahkan'); repaint(); }catch(e){ toast(e.message); } },
  async gjReopen(){ try{ setGaji(await run(call('api_statusGaji',S.pin,S.gj.month,'Draf'))); repaint(); }catch(e){} },
  async gjPay(){ try{ setGaji(await run(call('api_payGaji',S.pin,S.gj.month,S.gj.payDate||S.boot.today))); toast('Gaji direkod sebagai dibayar'); repaint(); }catch(e){} },
  gjSlip(el){ const d=S.data.gj, i=+el.dataset.i, g=Object.assign({},S.gj.rows[i]); const c=calcG(g,d.rates); Object.assign(g,c); if(d.status==='Draf') g.tarikhBayar=''; openSlip(g,d.syarikat); },
  slipStaf(el){ const s=S.data.dash.slip; openSlip(s.rows[+el.dataset.i], s.syarikat); },
  slipPrint(){ document.body.classList.add('printing-slip'); window.print(); setTimeout(()=>document.body.classList.remove('printing-slip'),500); },
  slipClose(){ const v=$('slipView'); if(v) v.style.display='none'; }
};
Object.assign(ACT, ACT13, ACT_SR, ACT_RS, ACT_HJ, ACT_BL, ACT_TT, ACT_TP);
document.addEventListener('click',e=>{ const el=e.target.closest('[data-act]'); if(!el) return; const f=ACT[el.dataset.act]; if(f){ e.preventDefault(); f(el,e); } });
document.addEventListener('keydown',e=>{ if(e.key==='Enter'&&e.target.id==='pin') login(); });

function refocus(sel,el){ let pos=null; try{ pos=el.selectionStart; }catch(e){} repaint(); const n=document.querySelector(sel); if(n){ n.focus(); try{ if(pos!=null) n.setSelectionRange(pos,pos); }catch(e){} } }
const IN = {
  rq(el){ S.R.q=el.value; refocus('[data-in="rq"]',el); },
  kq(el){ S.kat.q=el.value; refocus('[data-in="kq"]',el); },
  jumlah(el){ S.R.jumlah=el.value; }, telefon(el){ S.R.telefon=el.value; }, tarikh(el){ S.R.tarikh=el.value; }, keterangan(el){ S.R.keterangan=el.value; }, diskaun(el){ S.R.diskaun=el.value; const w=$('diskWarn'); if(w) w.innerHTML=diskaunWarn(rekodItems(),S.R); },
  agU(el){ S.ag.untung=el.value; S.ag.confirm=false; agRefresh(); },
  agB(el){ S.ag.bonus=el.value; S.ag.bConfirm=false; const b=document.querySelector('[data-act="agBonus"]'), x=Number(el.value)||0, p=Number(S.data.ag.ocbc&&S.data.ag.ocbc.profit)||0; if(b){ b.disabled=!(x>0&&x<=p+0.01); b.textContent='Rekod bonus OCBC → Bank Islam'; } },
  ke(el){ const k=el.dataset.k; S.kat.edit[k]=el.value; if(k==='beratKg'){ S.kat.edit.berat=el.value===''?'':Math.round(Number(el.value)*1000); } if(k==='le'||k==='beratKg') refocus('[data-in="ke"][data-k="'+k+'"]',el); },
  pk(el){ S.pk.edit[el.dataset.k]=el.value; },
  gj(el){ const r=S.gj.rows[+el.dataset.i]; r[el.dataset.k]=el.value; const c=calcG(r,S.data.gj.rates); const card=el.closest('section'); const n=card&&card.querySelector('.note'); if(n) n.innerHTML='<span>Kasar '+rm(c.kasar)+' − potongan '+rm(c.potongan)+'</span><b>Bersih '+rm(c.bersih)+'</b>'; },
  posIn(el){ const d=S.data.kat; S.kat.pos=S.kat.pos||{perKg:d.pos.perKg,step:d.pos.step}; S.kat.pos[el.dataset.k]=el.value; refocus('[data-in="posIn"][data-k="'+el.dataset.k+'"]',el); },
  kal(el){ S.kal.edit[el.dataset.k]=el.value; if(el.dataset.k==='semakTxt') S.kal.edit.semakAuto=false; },
  iv(el){ S.iv.edit[el.dataset.k]=el.value; ivRefresh(); },
  blE(el){ S.bl.edit[el.dataset.k]=el.value; if(el.dataset.k==='kadar'){ const t=$('blTot'); if(t) t.innerHTML=blTotHtml(S.bl.edit); } },
  blI(el){ S.bl.edit.items[+el.dataset.i][el.dataset.k]=el.value; const t=$('blTot'); if(t) t.innerHTML=blTotHtml(S.bl.edit); },
  blK(el){ S.bl.kedit[el.dataset.k]=el.value; },
  blR(el){ const s2=S.bl.sampai; (s2.rosak[el.dataset.b]=s2.rosak[el.dataset.b]||{})[el.dataset.j]=Number(el.value)||0; },
  kalT(el){ S.kal.tutup[el.dataset.k]=el.value; },
  kalTS(el){ S.kal.tutup[el.dataset.k]=el.value; },
  tpE(el){ S.tp.edit[el.dataset.k]=el.value; },
  tpq(el){ S.tp.q=el.value; refocus('[data-in="tpq"]',el); },
  hjF(el){ S.hj.form[el.dataset.k]=el.value; },
  hjE(el){ S.hj.edit[el.dataset.k]=el.value; },
  hjq(el){ S.hj.q=el.value; refocus('[data-in="hjq"]',el); },
  sr(el){ S.sr.edit[el.dataset.k]=el.value; srRefresh(); },
  srD(el){ S.sr.edit.d[el.dataset.k]=el.value; srRefresh(); },
  srq(el){ S.sr.q=el.value; refocus('[data-in="srq"]',el); },
  ivD(el){ S.iv.edit[el.dataset.k]=el.value; ivRefresh(); },
  ivq(el){ S.iv.edit.q=el.value; refocus('[data-in="ivq"]',el); },
  rec(el){ const b=el.dataset.b, sys=S.data.tx.baki[b], tag=$('rec-'+b.replace(/\s/g,'_')); if(el.value===''){ tag.className='tag t-n'; tag.textContent='—'; return; } const diff=Math.round((Number(el.value)-sys)*100)/100; if(Math.abs(diff)<0.01){ tag.className='tag t-g'; tag.textContent='Sepadan'; } else { tag.className='tag t-r'; tag.textContent='Beza '+rm(diff); } }
};
document.addEventListener('input',e=>{ const k=e.target.dataset&&e.target.dataset.in; if(k&&IN[k]&&e.target.type!=='file'&&e.target.type!=='checkbox'&&e.target.type!=='month'&&e.target.tagName!=='SELECT') IN[k](e.target); });
document.addEventListener('change',async e=>{
  const el=e.target, k=el.dataset&&el.dataset.in; if(!k) return;
  if(k==='resit'){ try{ busy(true); S.R.resit=await readReceipt(el.files[0]); S.R.resitName=el.files[0]?el.files[0].name:''; }catch(er){ toast(er.message); } finally{ busy(false); } repaint(); }
  if(k==='fixResit'){ try{ const r=await readReceipt(el.files[0]); await run(call('api_completeTx',S.pin,el.dataset.id,{resit:r})); toast('Resit disimpan'); go('tunai'); }catch(er){} }
  if(k==='month'){ S.tx.month=el.value; go('tunai'); }
  if(k==='pkSel'){ S.pk.edit[el.dataset.k]=el.value; if(el.dataset.k==='jenis'){ S.pk.edit.unit=el.value==='Tetap'?'bulan':'hari'; } repaint(); }
  if(k==='pkChk'){ S.pk.edit[el.dataset.k]=el.checked; }
  if(k==='pkDok'){ const e=S.pk.edit; try{ const f=await readReceipt(el.files[0]); S.data.pk=await run(call('api_savePekerja',S.pin,Object.assign({},e,{dokBaru:{nama:($('dokNama')||{}).value||el.files[0].name,file:f}}))); S.pk.edit=JSON.parse(JSON.stringify(S.data.pk.rows.find(x=>x.id===e.id))); toast('Dokumen disimpan'); repaint(); }catch(er){} }
  if(k==='gjMonth'){ S.gj.month=el.value; S.data.gj=null; go('gaji'); }
  if(k==='gjPay'){ S.gj.payDate=el.value; }
  if(k==='gj'){ const y=window.scrollY; repaint(); window.scrollTo(0,y); }
  if(k==='gjManual'){ const r=S.gj.rows[+el.dataset.i]; r.manual=el.checked; if(el.checked){ Object.assign(r, (function(c){ return {kwspP:c.kwspP,perkesoP:c.perkesoP,sipP:c.sipP,kwspM:c.kwspM,perkesoM:c.perkesoM,sipM:c.sipM}; })(calcG(Object.assign({},r,{manual:false}),S.data.gj.rates))); } repaint(); }
  if(k==='kalSel'){ const e=S.kal.edit, kk=el.dataset.k; e[kk]=el.value; if(kk==='jenis'&&e.semakAuto) e.semakTxt=(S.data.kal.semakAsal[el.value]||[]).join('\n'); if(kk==='mula'&&(!e.akhir||e.akhir<el.value)) e.akhir=el.value; rp(); }
  if(k==='kalChk'){ const p=S.data.kal.rows.find(x=>x.id===el.dataset.id); p.semak[+el.dataset.i].ok=el.checked; rp(); try{ setKal(await call('api_saveProgram',S.pin,progSaveObj(p),S.kal.month)); rp(); }catch(er){ toast(er.message); } }
  if(k==='ivD'){ S.iv.edit[el.dataset.k]=el.value; ivRefresh(); }
  if(k==='ivQ'){ S.iv.edit.items[el.dataset.j]=Math.max(0,Math.round(Number(el.value)||0)); rp(); }
  if((k==='sr'||k==='srD')&&el.type==='date'){ if(k==='srD') S.sr.edit.d[el.dataset.k]=el.value; else S.sr.edit[el.dataset.k]=el.value; srRefresh(); }
  if(k==='srDs'){ S.sr.edit.d[el.dataset.k]=el.value; rp(); }
  if(k==='srPick'){ srPick(S.sr.edit, el.dataset.k, el.value); rp(); }
  if(k==='srSalam'){ S.sr.edit.salam=el.checked; rp(); }
  if(k==='srAkuan'){ S.sr.edit.d.akuan=el.checked?'Ya':'Tidak'; rp(); }
  if(k==='blS'){ S.bl.sampai[el.dataset.k]=el.value; }
  if(k==='blSC'){ S.bl.sampai.semak[+el.dataset.i].ok=el.checked; rp(); }
  if(k==='blSK'){ S.bl.sampai.katalog=el.checked; }
  if(k==='blBy'){ S.bl.edit.rekodBayar=el.checked; }
  if(k==='blKBy'){ S.bl.kedit.rekodBayar=el.checked; }
  if(k==='blKB'){ const L=S.bl.kedit.beliIds, i=L.indexOf(el.dataset.id); if(el.checked&&i<0) L.push(el.dataset.id); if(!el.checked&&i>-1) L.splice(i,1); }
  if(k==='blE'&&el.type==='date'){ S.bl.edit[el.dataset.k]=el.value; }
  if(k==='blK'&&el.type==='date'){ S.bl.kedit[el.dataset.k]=el.value; }
  if(k==='kalTC'){ S.kal.tutup[el.dataset.k]=el.checked; rp(); }
  if(k==='tgs'){ const D=tugasDone(); D[el.dataset.k]=el.checked; try{ localStorage.setItem(tugasKey(),JSON.stringify(D)); }catch(e){} rp(); }
  if(k==='ivPay'){ S.iv.pay=el.value; }
  if(k==='lapMonth'){ S.lap.month=el.value; S.data.lap=null; go('laporan'); }
  if(k==='ke'&&el.tagName==='SELECT'){ IN.ke(el); }
  if(k==='impPos'){ S.imp.includePos=el.checked; impPreview(); }
  if(k==='impFile'){
    const f=el.files[0]; if(!f) return;
    try{ busy(true); const text=await f.text(); const orders=parseWasepme(text); if(!orders.length) throw new Error('Tiada pesanan dalam fail.'); S.imp={fileName:f.name, orders, includePos:true, preview:null, done:null}; }catch(er){ busy(false); toast(er.message); return; }
    busy(false); impPreview();
  }
});

render();
if(S.pin) login();
</script>
